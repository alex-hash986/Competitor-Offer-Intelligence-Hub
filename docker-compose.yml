services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-competitor_intel}
      POSTGRES_USER: ${POSTGRES_USER:-competitor_intel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-competitor_intel_local}
    volumes:
      - competitor_intel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "${COMPOSE_DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-competitor_intel}:${POSTGRES_PASSWORD:-competitor_intel_local}@db:5432/${POSTGRES_DB:-competitor_intel}}"
    restart: unless-stopped

volumes:
  competitor_intel_pgdata:
